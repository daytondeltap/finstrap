name: CI (Debug)
on: [push, pull_request]

jobs:
  build:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v6
      with:
        submodules: true

    - uses: actions/setup-dotnet@v5
      with:
        dotnet-version: '10.0.x'

    - name: Restore dependencies
      run: dotnet restore

    - name: Build
      run: dotnet build --no-restore

    - name: Regression checks
      run: dotnet run --project Tests/Finstrap.RegressionTests.csproj

    - name: Publish
      run: dotnet publish -p:PublishSingleFile=true -p:CommitHash=${{ github.sha }} -p:CommitRef=${{ github.ref_type }}/${{ github.ref_name }} -r win-x64 -c Debug --self-contained false .\Bloxstrap\Bloxstrap.csproj

    - name: Dashboard smoke test
      shell: pwsh
      run: |
        $out = Join-Path $env:RUNNER_TEMP "finstrap-smoke"
        $exe = Resolve-Path "Bloxstrap/bin/Debug/net10.0-windows10.0.19041.0/win-x64/publish/Finstrap.exe"
        $process = Start-Process -FilePath $exe -ArgumentList @('--command-center-smoke', "`"$out`"") -PassThru
        if (-not $process.WaitForExit(60000)) { $process.Kill(); throw "Dashboard smoke timed out" }
        Get-Content "$out/result.txt"
        if ($process.ExitCode -ne 0) { throw "Dashboard smoke failed: $($process.ExitCode)" }

    - name: Upload smoke evidence
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: dashboard-smoke-Debug
        path: ${{ runner.temp }}/finstrap-smoke/

    - name: Upload Artifact
      uses: actions/upload-artifact@v7
      with:
        name: Bloxstrap (Debug) (${{ github.sha }})
        path: .\Bloxstrap\bin\Debug\net10.0-windows10.0.19041.0\win-x64\publish\*