name: CI (Release)
on: [push, pull_request]

jobs:
  build:
    runs-on: windows-latest

    outputs:
      artifact-id: ${{ steps.upload-artifact.outputs.artifact-id }}

    steps:
    - uses: actions/checkout@v6
      with:
        submodules: true

    - uses: actions/setup-dotnet@v5
      with:
        dotnet-version: '10.0.x'

    - name: Restore dependencies
      run: dotnet restore

    - name: Build
      run: dotnet build -c Release --no-restore

    - name: Publish
      run: dotnet publish -p:PublishSingleFile=true -p:CommitHash=${{ github.sha }} -p:CommitRef=${{ github.ref_type }}/${{ github.ref_name }} -r win-x64 -c Release --self-contained false .\Bloxstrap\Bloxstrap.csproj

    - name: Dashboard smoke test
      shell: pwsh
      run: |
        $out = Join-Path $env:RUNNER_TEMP "finstrap-smoke"
        $exe = Resolve-Path "Bloxstrap/bin/Release/net10.0-windows10.0.19041.0/win-x64/publish/Finstrap.exe"
        $process = Start-Process -FilePath $exe -ArgumentList @('--command-center-smoke', "`"$out`"") -PassThru
        if (-not $process.WaitForExit(60000)) { $process.Kill(); throw "Dashboard smoke timed out" }
        Get-Content "$out/result.txt"
        if ($process.ExitCode -ne 0) { throw "Dashboard smoke failed: $($process.ExitCode)" }

    - name: Upload smoke evidence
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: dashboard-smoke-Release
        path: ${{ runner.temp }}/finstrap-smoke/

    - name: Upload Artifact
      id: upload-artifact
      uses: actions/upload-artifact@v7
      with:
        name: Finstrap (Release) (${{ github.sha }})
        path: .\Bloxstrap\bin\Release\net10.0-windows10.0.19041.0\win-x64\publish\*

  release:
    needs: build
    runs-on: windows-latest
    if: github.repository == 'daytondeltap/finstrap' && startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v8
        with:
          artifact-ids: ${{ needs.build.outputs.artifact-id }}
          path: package
      - uses: actions/download-artifact@v8
        with:
          name: dashboard-smoke-Release
          path: smoke
      - name: Package tested build and publish
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          Copy-Item docs/release-notes/Licenses package/Licenses -Recurse
          Compress-Archive -Path package/* -DestinationPath Finstrap-Windows-x64.zip
          Compress-Archive -Path docs/release-notes/Licenses/* -DestinationPath Finstrap-Licenses.zip
          Copy-Item package/Finstrap.exe Finstrap.exe
          Copy-Item smoke/dashboard.png dashboard-smoke.png
          $files = @('Finstrap.exe','Finstrap-Windows-x64.zip','Finstrap-Licenses.zip','dashboard-smoke.png')
          $files | ForEach-Object { $hash = (Get-FileHash $_ -Algorithm SHA256).Hash.ToLower(); "$hash  $_" } | Set-Content SHA256SUMS.txt
          gh release create $env:GITHUB_REF_NAME @files SHA256SUMS.txt --verify-tag --title "Finstrap $env:GITHUB_REF_NAME" --notes-file docs/release-notes/notes-v2.12.2.md --latest
